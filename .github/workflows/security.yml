# .github/workflows/security.yml
# ─────────────────────────────────────────────────────────────────
# DevSecOps Security Pipeline — Full Version with Executive Dashboard
#
# TRIGGERS:
#   push            → runs on every git push
#   pull_request    → runs on every PR (blocks merge if any job fails)
#   schedule        → runs every Monday at 2 AM UTC automatically
#   workflow_dispatch → adds a manual "Run workflow" button in GitHub UI
#
# JOBS:
#   1. 🔑 Secret Scanning    — Gitleaks
#   2. 📦 Dependency Audit   — pip-audit
#   3. 🔍 Static Analysis    — Bandit (SARIF → Security tab)
#   4. 🐳 Container Scanning — Trivy  (SARIF → Security tab)
#   5. 📊 Executive Report   — Publishes a consolidated, clean UI dashboard
# ─────────────────────────────────────────────────────────────────

name: Security Pipeline

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * 1"   # Every Monday at 02:00 AM UTC
  workflow_dispatch:        # Adds "Run workflow" button in the Actions tab

permissions:
  contents: read
  security-events: write

jobs:

  # ═══════════════════════════════════════════════════════════════
  # JOB 1 — Secret Scanning (Gitleaks)
  # ═══════════════════════════════════════════════════════════════
  secret-scanning:
    name: 🔑 Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════
  # JOB 2 — Dependency Scanning (pip-audit)
  # ═══════════════════════════════════════════════════════════════
  dependency-scanning:
    name: 📦 Dependency Scanning (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r app/requirements.txt

  # ═══════════════════════════════════════════════════════════════
  # JOB 3 — Static Analysis / SAST (Bandit)
  # ═══════════════════════════════════════════════════════════════
  static-analysis:
    name: 🔍 Static Analysis (Bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit with SARIF support
        run: pip install bandit[sarif]

      - name: Run Bandit (generate SARIF report)
        id: bandit
        run: bandit -r app/ -ll -f sarif -o bandit-results.sarif
        continue-on-error: true

      - name: Upload Bandit SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit-sast
        if: always()

      - name: Upload Bandit report as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sarif-report
          path: bandit-results.sarif
          retention-days: 30
        if: always()

      - name: Fail pipeline if Bandit found issues
        if: steps.bandit.outcome == 'failure'
        run: |
          echo "::error::Bandit found security issues. See Security → Code scanning for details."
          bandit -r app/ -ll
          exit 1

  # ═══════════════════════════════════════════════════════════════
  # JOB 4 — Container Scanning (Trivy)
  # ═══════════════════════════════════════════════════════════════
  container-scanning:
    name: 🐳 Container Scanning (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devsecops-pipeline:${{ github.sha }} .

      - name: Run Trivy (generate SARIF report — CRITICAL and HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-pipeline:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Run Trivy gate (fail pipeline only on CRITICAL CVEs)
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-pipeline:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        continue-on-error: true

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container
        if: always()

      - name: Upload Trivy report as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif-report
          path: trivy-results.sarif
          retention-days: 30
        if: always()

      - name: Fail pipeline if Trivy found fixable CVEs
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "::error::Trivy found CRITICAL CVEs with available fixes. See Security tab."
          exit 1

  # ═══════════════════════════════════════════════════════════════
  # JOB 5 — Consolidated Executive Security Dashboard
  # ═══════════════════════════════════════════════════════════════
  security-dashboard:
    name: 📊 Security Summary Dashboard
    runs-on: ubuntu-latest
    needs: [secret-scanning, dependency-scanning, static-analysis, container-scanning]
    if: always()   # Always run so you get the full report even if a scan failed

    steps:
      - name: Generate Consolidated Dashboard
        run: |
          # Read status of each upstream job
          GITLEAKS="${{ needs.secret-scanning.result }}"
          PIPAUDIT="${{ needs.dependency-scanning.result }}"
          BANDIT="${{ needs.static-analysis.result }}"
          TRIVY="${{ needs.container-scanning.result }}"

          format_status() {
            if [ "$1" = "success" ]; then
              echo "🟢 **PASSED**"
            elif [ "$1" = "failure" ]; then
              echo "🔴 **FAILED**"
            else
              echo "⚪ **SKIPPED / UNKNOWN**"
            fi
          }

          S_GITLEAKS=$(format_status "$GITLEAKS")
          S_PIPAUDIT=$(format_status "$PIPAUDIT")
          S_BANDIT=$(format_status "$BANDIT")
          S_TRIVY=$(format_status "$TRIVY")

          OVERALL="🟢 **COMPLIANT (SAFE TO MERGE)**"
          if [ "$GITLEAKS" != "success" ] || [ "$PIPAUDIT" != "success" ] || [ "$BANDIT" != "success" ] || [ "$TRIVY" != "success" ]; then
            OVERALL="🔴 **NON-COMPLIANT (MERGE BLOCKED)**"
          fi

          cat << 'EOF' > dashboard.md
          # 🛡️ DevSecOps Automated Security Report

          > **Executive Summary for Commit:** `${{ github.sha }}`  
          > **Triggered By:** `${{ github.actor }}` on `${{ github.event_name }}` (`${{ github.ref_name }}`)

          ---

          ### 🚦 Pipeline Gate Status: OVERALL_STATUS_PLACEHOLDER

          | Layer | Security Tool | Domain Checked | Result | Policy Gate |
          | :--- | :--- | :--- | :---: | :---: |
          | **1. Secrets** | **Gitleaks v2** | Exposed API Keys, Tokens, Passwords in Git | GITLEAKS_STATUS | Zero-Tolerance (Block) |
          | **2. Dependencies** | **pip-audit** | Known CVEs in Python `requirements.txt` | PIPAUDIT_STATUS | Block on Known CVEs |
          | **3. Code (SAST)** | **Bandit** | Insecure Python code patterns, injection, eval | BANDIT_STATUS | Block on Med/High |
          | **4. Container** | **Trivy** | Vulnerabilities in Docker OS & Base Image | TRIVY_STATUS | Block on CRITICAL (Patched) |

          ---

          ### 📑 Quick Links & Audit Trail
          - 🔍 **[GitHub Code Scanning Alerts](../../security/code-scanning)** (Interactive SARIF findings)
          - 📦 **[Download SARIF Artifacts](#artifacts)** (Available for 30 days)
          - 🛡️ **Branch Policy:** Branch protection active on \`main\` branch.

          *Report generated automatically by DevSecOps CI/CD Pipeline.*
          EOF

          # Replace placeholders
          sed -i "s|OVERALL_STATUS_PLACEHOLDER|$OVERALL|g" dashboard.md
          sed -i "s|GITLEAKS_STATUS|$S_GITLEAKS|g" dashboard.md
          sed -i "s|PIPAUDIT_STATUS|$S_PIPAUDIT|g" dashboard.md
          sed -i "s|BANDIT_STATUS|$S_BANDIT|g" dashboard.md
          sed -i "s|TRIVY_STATUS|$S_TRIVY|g" dashboard.md

          # Append to GitHub Step Summary
          cat dashboard.md >> $GITHUB_STEP_SUMMARY
